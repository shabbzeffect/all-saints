# ============================================================================
# GitHub Actions CI Workflow - SaintsHub
# ============================================================================
# Triggers on: push to main, pull requests
# Jobs: lint, typecheck, test, build
# ============================================================================

name: "SaintsHub CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# ============================================================================
# Global Configuration
# ============================================================================
defaults:
  run:
    working-directory: /

env:
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_URL: "https://saintshub.example.com"

# ============================================================================
# Workflow Permissions
# ============================================================================
permissions:
  contents: read
  packages: read
  id-token: write

# ============================================================================
# Jobs
# ============================================================================

jobs:
  # ======================================================================
  # Lint Job
  # ======================================================================
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run ESLint"
        run: npm run lint

      - name: "Run Prettier"
        run: npx --yes prettier --write . || true

      - name: "Check Prettier Status"
        run: npx prettier --check .

  # ======================================================================
  # Typecheck Job
  # ======================================================================
  typecheck:
    name: "Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run TypeScript Check"
        run: npm run typecheck

  # ======================================================================
  # Test Job
  # ======================================================================
  test:
    name: "Run Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - unit: "vitest run"
          - integration: "vitest run --integration"
          - e2e: "playwright test"

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run Unit Tests"
        if: matrix.unit
        run: npm run test

      - name: "Run Integration Tests"
        if: matrix.integration
        run: npm run test -- --run integration

      - name: "Run E2E Tests"
        if: matrix.e2e
        run: npm run test:e2e

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.job }}
          path: tests/
          retention-days: 30

  # ======================================================================
  # Build Job
  # ======================================================================
  build:
    name: "Build & Generate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test]

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Generate Prisma Client"
        run: npm run db:generate

      - name: "Run Prisma Migrate Diff"
        run: npm run db:migrate:prod

      - name: "Build Next.js Application"
        run: npm run build

      - name: "Analyze Bundle Size"
        run: npx next-bundle-analyzer --json > bundle-report.json 2>/dev/null || echo "Bundle analysis skipped"

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.run_id }}
          path: .next/
          retention-days: 7

  # ======================================================================
  # Database Migrations Job
  # ======================================================================
  db-migrations:
    name: "Database Migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run Prisma Migrate Deploy"
        run: npm run db:migrate:prod

      - name: "Run Prisma Studio (optional)"
        run: npx prisma studio --host localhost --port 5555 &
        shell: bash

  # ======================================================================
  # Security Scan Job
  # ======================================================================
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run npm Audit"
        run: npm audit --audit-level=moderate || true

      - name: "Check for Known Vulnerabilities"
        run: |
          # Basic check for deprecated dependencies
          npm ls --depth=0 2>&1 | head -50 || true

  # ======================================================================
  # Deploy Job (Production only)
  # ======================================================================
  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Generate Prisma Client"
        run: npm run db:generate

      - name: "Run Prisma Migrate Deploy"
        run: npm run db:migrate:prod

      - name: "Deploy to Vercel"
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-organization-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
          alias-domains: "saintshub.example.com"

      - name: "Notify Deployment"
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: "✅ SaintsHub deployed successfully to production!"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  # ======================================================================
  # Backup Job (Daily)
  # ======================================================================
  backup:
    name: "Database Backup"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    schedule:
      - cron: "0 2 * * *"  # Daily at 2 AM UTC

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Backup PostgreSQL Database"
        run: |
          # Connect to postgres container and dump database
          docker exec $(docker ps -q -f name=postgres) \
            pg_dump -U postgres -d saintshub > backup_$(date +%Y%m%d).sql
          echo "Backup created"

      - name: "Upload Backup"
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup_*.sql
          retention-days: 30